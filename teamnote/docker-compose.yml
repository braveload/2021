name: teamnote

services:
  db:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: teamnote_owner
      POSTGRES_DB: teamnote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      TZ: UTC
    volumes:
      - teamnote_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamnote_owner -d teamnote"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      OWNER_DATABASE_URL: postgres://teamnote_owner:${POSTGRES_PASSWORD}@db:5432/teamnote
      DATABASE_URL: postgres://teamnote_app:${APP_DB_PASSWORD}@db:5432/teamnote
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3200:3000"

volumes:
  teamnote_pgdata:
